org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# The infinite-dungeon-api release this module builds against. Referenced by
# build.gradle (compile, test, and runtime) and by neoforge.mods.toml, whose
# required version range is derived from it, so the two cannot drift.
api_version=1.0.0-alpha.8

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=infinite_dungeon_spawn_safety
mod_name=Infinite Dungeon Spawn Safety
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.7
mod_group_id=org.bitwisemadness.infinitedungeonspawnsafety
mod_authors=Bitwise Madness
mod_description=Keeps chosen dimensions mostly safe: per-category spawn toggles, a dimension filter, and a magicule gate that only ever blocks natural spawns when the ambient magicule of the spawn chunk cannot sustain the mob. Works with or without the infinite-dungeon core module.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
